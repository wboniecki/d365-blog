# Dev containers for d365-blog
# Create / update:  distrobox assemble create --file distrobox.ini
# Enter:            distrobox enter d365-blog-web
#
# Each phase gets its own box, so tool versions never leak between projects
# or into the Bazzite host. Init hooks run as root on every start, so each
# one checks before installing.

[d365-blog-web]
image=quay.io/toolbx/ubuntu-toolbox:24.04
pull=true
replace=false
additional_packages="git gh curl ca-certificates gpg build-essential"
# VS Code GUI, exported to the host app menu as "Code (on d365-blog-web)"
exported_apps="code"
init_hooks="command -v code >/dev/null || (curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /usr/share/keyrings/vscode.gpg && echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/vscode.gpg] https://packages.microsoft.com/repos/code stable main' > /etc/apt/sources.list.d/vscode.list && apt-get update && apt-get install -y code)"
# Node.js 22 LTS (Astro needs >= 22.22.0, even-numbered majors only)
init_hooks="command -v node >/dev/null || (curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs)"
# Azure CLI
init_hooks="command -v az >/dev/null || curl -sL https://aka.ms/InstallAzureCLIDeb | bash"

# Phase 4, uncomment when you start the Rust API.
# A separate home keeps ~/.cargo and ~/.rustup inside this box only.
# [d365-blog-rust]
# image=quay.io/toolbx/ubuntu-toolbox:24.04
# home=~/.local/share/distrobox-homes/d365-blog-rust
# additional_packages="git curl build-essential pkg-config libssl-dev"
